hardware:
  gpu: "1x NVIDIA H100 SXM5 80GB (ONLY — no A100 fallback; A100 lacks FP8 tensor cores and would
        silently fall back to FP16, which is NOT precision-equivalent)"
  vcpu_min: 16
  ram_gb_min: 128
  nvme_gb_min: 500
serving:
  # Qwen3 / Llama endpoints: vLLM pinned to 0.27.1 (PyPI release, Aug 2026).
  # Container pinned by DIGEST (resolved Day 0 via registry metadata, 2026-08-17;
  # re-verified at staging with `docker pull vllm/vllm-openai@sha256:0a51…`):
  #   vllm/vllm-openai:v0.27.1 — image built 2026-08-11, vLLM build commit
  #   6e448d0ea9bf3d88d898b65449ca6dc2aec170ac, CUDA 13.0.2,
  #   TORCH_CUDA_ARCH_LIST includes 9.0 (H100 sm_90 supported).
  engine: vllm
  vllm_version: "0.27.1"
  container_image: "vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967"
  prefix_caching: required
  gemma_endpoint:
    # 2026-08-29 (user decision, choice 2-C): the vLLM->sglang->shim waterfall is RETIRED.
    # Tool-call extraction for gemma-4-31B-it — same as for every other pilot model — goes
    # through serving/tool_call_shim.py (UniformToolShim): prompt-formatted tool schemas +
    # guided-JSON + schema validation. One frozen extraction layer for the whole experiment.
    # Upstream gemma4-parser issues (#39468, #44522) no longer gate Day 0.
    extraction: {layer: serving/tool_call_shim.py, class: UniformToolShim, guided_json: true, max_retries: 2}
    gate: "shim extraction 20/20 on the frozen probe battery (T2 in docs/NEW_PARAMETER_VALIDATION.md), else STOP"
