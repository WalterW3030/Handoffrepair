# Model pins — FULLY PINNED (2026-08-15). Exact checkpoint = hf_id + revision commit + per-file
# safetensors sha256 (see configs/weight_sha256.lock). Precision is part of the version pin.
# ITEM 3: Llama-3.3-70B uses the OFFICIAL PREQUANTIZED checkpoint (Red Hat validated FP8-dynamic),
# not on-the-fly quantization of the BF16 weights — the checkpoint itself is pinned, so there is
# no quantization recipe to drift. Hardware: single H100 80GB ONLY.
# Hash provenance: revision commits and LFS sha256 oids read from the HF Hub API (2026-08-15);
# re-verified against the downloaded files at Day-0 staging (mismatch aborts the run).
calibrated_pair_1:
  source: {hf_id: Qwen/Qwen3-32B, revision: "9216db5781bf21249d130ec9da846c4624c16137",
           precision: fp8, quantization: "vllm --quantization fp8 (dynamic)",
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-32B", gated: false, license: apache-2.0}
  target: {hf_id: Qwen/Qwen3-8B, revision: "b968826d9c46dd6066d109eabc6255188de91218",
           precision: fp16, quantization: none,
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-8B", gated: false, license: apache-2.0}
calibrated_pair_2:
  # REPLACED 2026-08-28 (user decision): Llama-3.3-70B-Instruct-FP8-dynamic -> Qwen3-30B-A3B-Instruct-2507.
  # Reason (R12/R13 analysis): 70B FP8 (~70 GiB) + KV + activation on a single 79.19 GiB H100 leaves
  # only ~6 GiB free at ctx=16384 — BELOW the 10% headroom floor at ANY usable context length.
  # Qwen3-30B-A3B (MoE, 48L/4KV heads, 3.3B active) fits with +16.2 GiB headroom AND is a strong
  # tool-caller (Qwen-Agent/hermes parser). Instruct-2507 branch chosen over the original for its
  # 256K native context and better instruction-following/tool-use (Qwen model card, Jul 2025).
  source: {hf_id: Qwen/Qwen3-30B-A3B-Instruct-2507,
           revision: "0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe",
           precision: bf16, quantization: none,
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-30B-A3B-Instruct-2507",
           gated: false, license: apache-2.0,
           tool_calling: "uniform shim (serving/tool_call_shim.py), decision 2026-08-29"}
  target: {hf_id: Qwen/Qwen3-32B, revision: "9216db5781bf21249d130ec9da846c4624c16137",
           precision: fp8, quantization: "vllm --quantization fp8 (dynamic)",
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-32B", gated: false, license: apache-2.0}
