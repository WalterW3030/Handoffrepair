# Model pins — FULLY PINNED (2026-08-15). Exact checkpoint = hf_id + revision commit + per-file
# safetensors sha256 (see configs/weight_sha256.lock). Precision is part of the version pin.
# ITEM 3: Llama-3.3-70B uses the OFFICIAL PREQUANTIZED checkpoint (Red Hat validated FP8-dynamic),
# not on-the-fly quantization of the BF16 weights — the checkpoint itself is pinned, so there is
# no quantization recipe to drift. Hardware: single H100 80GB ONLY.
# Hash provenance: revision commits and LFS sha256 oids read from the HF Hub API (2026-08-15);
# re-verified against the downloaded files at Day-0 staging (mismatch aborts the run).
calibrated_pair_1:
  source: {hf_id: Qwen/Qwen3-32B, revision: "9216db5781bf21249d130ec9da846c4624c16137",
           precision: fp8, quantization: "vllm --quantization fp8 (dynamic)",
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-32B", gated: false, license: apache-2.0}
  target: {hf_id: Qwen/Qwen3-8B, revision: "b968826d9c46dd6066d109eabc6255188de91218",
           precision: fp16, quantization: none,
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-8B", gated: false, license: apache-2.0}
calibrated_pair_2:
  # REPLACED 2026-08-28 (user decision): Llama-3.3-70B-Instruct-FP8-dynamic -> Qwen3-30B-A3B-Instruct-2507.
  # Reason (R12/R13 analysis): 70B FP8 (~70 GiB) + KV + activation on a single 79.19 GiB H100 leaves
  # only ~6 GiB free at ctx=16384 — BELOW the 10% headroom floor at ANY usable context length.
  # Qwen3-30B-A3B (MoE, 48L/4KV heads, 3.3B active) fits with +16.2 GiB headroom AND is a strong
  # tool-caller (Qwen-Agent/hermes parser). Instruct-2507 branch chosen over the original for its
  # 256K native context and better instruction-following/tool-use (Qwen model card, Jul 2025).
  source: {hf_id: Qwen/Qwen3-30B-A3B-Instruct-2507,
           revision: "TO_PIN",               # pin at staging: hf API revision + per-file sha256
           precision: bf16, quantization: none,
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-30B-A3B-Instruct-2507",
           gated: false, license: apache-2.0,
           tool_calling: "hermes parser (Qwen3 chat template has native Hermes-style tool support)"}
  target: {hf_id: Qwen/Qwen3-32B, revision: "9216db5781bf21249d130ec9da846c4624c16137",
           precision: fp8, quantization: "vllm --quantization fp8 (dynamic)",
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-32B", gated: false, license: apache-2.0}
held_out_pair:
  source: {hf_id: Qwen/Qwen3-32B, revision: "9216db5781bf21249d130ec9da846c4624c16137",
           precision: fp8, quantization: "vllm --quantization fp8 (dynamic)",
           sha256: "configs/weight_sha256.lock#Qwen/Qwen3-32B", gated: false, license: apache-2.0}
  # SWITCHED Gemma-3-27B -> Gemma-4-31B (user decision 2026-08-11): Apache 2.0 (no gating),
  # modern, still a different family than Qwen/Llama so held-out "interface distance" is preserved.
  # HF repo id is case-sensitive: google/gemma-4-31B-it (capital B).
  target: {hf_id: google/gemma-4-31B-it, revision: "842da3794eaa0b77d5f08bae87a17459d91ff475",
           precision: bf16, quantization: none,
           sha256: "configs/weight_sha256.lock#google/gemma-4-31B-it",
           gated: false, license: "Apache-2.0",
           tool_calling: "NATIVE (<|tool_call>...<tool_call|>) — see P2 gate in serving notes"}
user_simulator:
  hf_id: Qwen/Qwen3-8B
  revision: "b968826d9c46dd6066d109eabc6255188de91218"
  precision: fp16
  sha256: "configs/weight_sha256.lock#Qwen/Qwen3-8B"
  seed: 101
hardware:
  gpu: "1x NVIDIA H100 SXM5 80GB (ONLY — no A100 fallback; A100 lacks FP8 tensor cores and would
        silently fall back to FP16, which is NOT precision-equivalent)"
  vcpu_min: 16
  ram_gb_min: 128
  nvme_gb_min: 500
serving:
  # Qwen3 / Llama endpoints: vLLM pinned to 0.27.1 (PyPI release, Aug 2026).
  # Container pinned by DIGEST (resolved Day 0 via registry metadata, 2026-08-17;
  # re-verified at staging with `docker pull vllm/vllm-openai@sha256:0a51…`):
  #   vllm/vllm-openai:v0.27.1 — image built 2026-08-11, vLLM build commit
  #   6e448d0ea9bf3d88d898b65449ca6dc2aec170ac, CUDA 13.0.2,
  #   TORCH_CUDA_ARCH_LIST includes 9.0 (H100 sm_90 supported).
  engine: vllm
  vllm_version: "0.27.1"
  container_image: "vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967"
  prefix_caching: required
  gemma_endpoint:
    # P2 GATE (Day-0 blocker, unchanged): Gemma-4 tool-call parsing in vLLM is still reported
    # unreliable as of v0.24.0 (upstream issues #39468, #44522; parser leaks raw tokens).
    # Both options below are PINNED; the choice between them is a predeclared decision rule,
    # not a TBD:
    #   1) serve gemma-4-31B-it with vllm 0.27.1 + --tool-call-parser gemma4
    #      --reasoning-parser gemma4 + vendored examples/tool_chat_template_gemma4.jinja
    #      (sha256 afdbb2ab...3b8927); run the frozen 20-probe tool-call set.
    #   2) IF parse/structure success < 100% on the probe set -> switch THIS ENDPOINT ONLY to
    #      sglang v0.5.14 (pinned; reported working for gemma4 tool calling, Jul 2026) with the
    #      same probe gate. gemma_tool_shim.py remains the last-resort fallback (tested).
    primary: {engine: vllm, version: "0.27.1", parser: gemma4}
    fallback: {engine: sglang, version: "0.5.14", parser: gemma4}
    gate: "20/20 frozen probe tool calls parse correctly, else fallback; else shim; else STOP"
