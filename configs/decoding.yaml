# FROZEN decoding + runtime settings (advisor bundle item 4). Applies to every model, every cell.
decoding:
  temperature: 0.0            # deterministic; seed from configs/seeds.yaml governs any residual RNG
  top_p: 1.0
  max_new_tokens: 1024
  seed_from: configs/seeds.yaml
context:
  max_model_len: 16384        # capped (not 128K) — keeps Llama-70B FP8 KV pool within H100 80GB
  note: "16K covers ToolSandbox multi-turn trajectories with headroom; raising it post-freeze
         requires a new tag"
timeouts:
  per_turn_seconds: 300
  per_episode_seconds: 3600
  on_timeout: "log episode as failed with gate_branch=timeout; NO retry beyond the frozen retry rule"
retry_rule:
  max_transport_retries: 3    # transport-level failures only (5xx/connection), same logical_op_id
  semantic_retries: 0         # a parsed-but-wrong action is DATA, never retried
tool_parsers:
  Qwen/Qwen3-32B: hermes
  Qwen/Qwen3-8B: hermes
  Qwen/Qwen3-30B-A3B-Instruct-2507: hermes
  google/gemma-4-31B-it: gemma4   # NATIVE tool calling; gemma_tool_shim.py retained only as
                                  # last-resort fallback if the pinned vLLM/sglang parser fails
serving:
  engine: vllm
  gpu_memory_utilization: 0.90   # aligned with all serving/staging launchers (R12 headroom)
  enable_prefix_caching: true
  enforce_eager: false
